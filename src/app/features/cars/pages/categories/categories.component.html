<div class="categories-page min-h-screen bg-gradient-to-br from-yellow-50 via-orange-50 to-yellow-100 dark:from-gray-800 dark:via-gray-700 dark:to-gray-900 py-8 md:py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Back Button -->
    <button
      routerLink="/"
      class="flex items-center text-gray-600 dark:text-gray-400 hover:text-yellow-600 dark:hover:text-yellow-400 transition-colors mb-6"
    >
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>

    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Nos Catégories
      </h1>
      <p class="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
        Explorez notre collection de voitures anciennes par catégorie
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div
        *ngFor="let category of categories"
        (click)="viewCategory(category)"
        class="category-card group relative overflow-hidden rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 cursor-pointer"
      >
        <!-- Image -->
        <div class="relative h-64 overflow-hidden">
          <img
            [src]="category.image"
            [alt]="category.name"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
          <!-- Count Badge -->
          <div class="absolute top-4 right-4 bg-yellow-400 text-gray-900 font-bold py-1 px-3 rounded-full text-sm">
            {{ category.count || 0 }} voitures
          </div>
        </div>

        <!-- Content -->
        <div class="absolute bottom-0 left-0 right-0 p-6 text-white">
          <h3 class="text-2xl font-bold mb-2">{{ category.name }}</h3>
          <p class="text-sm mb-4 opacity-90">{{ category.description }}</p>
          <button class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-2 px-6 rounded-lg transition-all duration-300 transform group-hover:scale-105">
            Voir les voitures
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
