<div class="latest-news-section py-12 md:py-16 bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-800 dark:to-gray-900">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Dernières Actualités
      </h2>
      <p class="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
        Restez informé sur le monde des voitures anciennes
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
      <article
        *ngFor="let article of articles"
        class="news-card bg-white dark:bg-gray-800 rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden transform hover:-translate-y-2 group"
      >
        <!-- Image -->
        <div class="relative h-48 overflow-hidden">
          <img
            [src]="article.image"
            [alt]="article.title"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
          />
          <div class="absolute top-4 left-4">
            <span class="bg-yellow-400 text-gray-900 font-semibold px-3 py-1 rounded-full text-sm">
              {{ article.category }}
            </span>
          </div>
        </div>

        <!-- Content -->
        <div class="p-6">
          <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">{{ article.date }}</p>
          <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-3 group-hover:text-yellow-600 dark:group-hover:text-yellow-400 transition-colors">
            {{ article.title }}
          </h3>
          <p class="text-gray-600 dark:text-gray-300 mb-4 line-clamp-3">
            {{ article.excerpt }}
          </p>
          <button class="text-yellow-600 dark:text-yellow-400 font-semibold hover:text-yellow-700 dark:hover:text-yellow-500 transition-colors flex items-center">
            Lire plus
            <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </article>
    </div>
  </div>
</div>
