<div class="featured-cars-section py-12 md:py-16 bg-white dark:bg-gray-900">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Voitures en Vedette
      </h2>
      <p class="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
        Découvrez notre sélection de voitures anciennes exceptionnelles
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
      <div
        *ngFor="let car of featuredCars"
        class="featured-car-card group bg-white dark:bg-gray-800 rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden transform hover:-translate-y-2"
      >
        <!-- Image -->
        <div class="relative h-64 overflow-hidden">
          <img
            [src]="car.imageUrl"
            [alt]="car.brand + ' ' + car.model"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          <!-- Action Buttons -->
          <div class="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
            <button
              (click)="toggleFavorite(car); $event.stopPropagation()"
              [class.text-red-500]="isFavorite(car.id)"
              [class.text-white]="!isFavorite(car.id)"
              class="w-10 h-10 bg-black/50 hover:bg-black/70 rounded-full flex items-center justify-center backdrop-blur-sm transition-all"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
              </svg>
            </button>
            <button
              (click)="toggleCart(car); $event.stopPropagation()"
              [class.text-yellow-400]="isInCart(car.id)"
              [class.text-white]="!isInCart(car.id)"
              class="w-10 h-10 bg-black/50 hover:bg-black/70 rounded-full flex items-center justify-center backdrop-blur-sm transition-all"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Content -->
        <div class="p-6">
          <div class="mb-4">
            <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">
              {{ car.brand }} {{ car.model }}
            </h3>
            <p class="text-yellow-600 dark:text-yellow-400 font-semibold">{{ car.year }}</p>
          </div>

          <div class="mb-4">
            <p class="text-3xl font-bold text-gray-900 dark:text-white">
              {{ formatPrice(car.price) }}
            </p>
          </div>

          <!-- Hover Details -->
          <div class="featured-car-details opacity-0 group-hover:opacity-100 transition-opacity duration-300 space-y-2">
            <div class="flex items-center text-gray-600 dark:text-gray-300" *ngIf="car.engine">
              <svg class="w-5 h-5 mr-2 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
              </svg>
              <span class="font-medium">Moteur: {{ car.engine }}</span>
            </div>
            <div class="flex items-center text-gray-600 dark:text-gray-300" *ngIf="car.maxSpeed">
              <svg class="w-5 h-5 mr-2 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
              </svg>
              <span class="font-medium">Vitesse max: {{ car.maxSpeed }}</span>
            </div>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">{{ car.description }}</p>
          </div>

          <button
            [routerLink]="['/cars', car.id]"
            class="mt-4 w-full bg-gradient-to-r from-yellow-400 to-yellow-500 hover:from-yellow-500 hover:to-yellow-600 text-gray-900 font-bold py-3 px-6 rounded-lg transition-all duration-300 transform group-hover:scale-105"
          >
            Voir Détails
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
