<div class="testimonials-section py-12 md:py-16 bg-white dark:bg-gray-900">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Témoignages Clients
      </h2>
      <p class="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
        Découvrez ce que nos clients disent de nous
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div
        *ngFor="let testimonial of testimonials"
        class="testimonial-card bg-gradient-to-br from-yellow-50 to-orange-50 dark:from-gray-800 dark:to-gray-700 rounded-xl p-6 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2"
      >
        <!-- Rating -->
        <div class="flex mb-4">
          <span *ngFor="let star of [1,2,3,4,5]" class="text-yellow-400">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
          </span>
        </div>

        <!-- Comment -->
        <p class="text-gray-700 dark:text-gray-300 mb-6 italic">
          "{{ testimonial.comment }}"
        </p>

        <!-- Author -->
        <div class="flex items-center">
          <img
            [src]="testimonial.image"
            [alt]="testimonial.name"
            class="w-12 h-12 rounded-full mr-4"
          />
          <div>
            <p class="font-bold text-gray-900 dark:text-white">{{ testimonial.name }}</p>
            <p class="text-sm text-gray-600 dark:text-gray-400" *ngIf="testimonial.location">
              {{ testimonial.location }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
