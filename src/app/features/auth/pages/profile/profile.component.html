<div class="profile-page min-h-screen bg-gradient-to-br from-yellow-50 via-orange-50 to-yellow-100 dark:from-gray-800 dark:via-gray-700 dark:to-gray-900 py-12 md:py-16">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Back Button -->
    <button
      routerLink="/"
      class="flex items-center text-gray-600 dark:text-gray-400 hover:text-yellow-600 dark:hover:text-yellow-400 transition-colors mb-6"
    >
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>

    <div *ngIf="user" class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8">
      <div class="text-center mb-8">
        <div class="w-24 h-24 bg-gradient-to-br from-yellow-400 to-yellow-500 rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="text-4xl font-bold text-gray-900">
            {{ user.firstName?.[0] }}{{ user.lastName?.[0] }}
          </span>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-2">
          {{ user.firstName }} {{ user.lastName }}
        </h1>
        <p class="text-gray-600 dark:text-gray-400">{{ user.email }}</p>
      </div>

      <div class="space-y-6">
        <!-- Profile Info -->
        <div class="border-t border-gray-200 dark:border-gray-700 pt-6">
          <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Informations personnelles</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Prénom</label>
              <p class="text-gray-900 dark:text-white">{{ user.firstName }}</p>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Nom</label>
              <p class="text-gray-900 dark:text-white">{{ user.lastName }}</p>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
              <p class="text-gray-900 dark:text-white">{{ user.email }}</p>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="border-t border-gray-200 dark:border-gray-700 pt-6">
          <button
            (click)="logout()"
            class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg transition-colors"
          >
            Se déconnecter
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
